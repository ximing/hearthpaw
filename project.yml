name: TuanTuan
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: YES
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "6"
    PRODUCT_BUNDLE_IDENTIFIER: com.tuantuan.prototype
    CLANG_ENABLE_MODULES: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  TuanTuan:
    type: application
    platform: macOS
    sources:
      - path: Sources/TuanTuan
      - path: Resources
        buildPhase: resources
        excludes:
          - Info.plist
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: 团团
        CFBundleDisplayName: 团团
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "6"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "TuanTuan local prototype, 2026"
    settings:
      base:
        PRODUCT_NAME: TuanTuan
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
schemes:
  TuanTuan:
    build:
      targets:
        TuanTuan: all
